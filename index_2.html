<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Quiz 互动问答</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Noto+Sans+SC:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#101735; --panel:#19224a; --panel-2:#222d5e; --line:#35437f;
  --ink:#f5f7ff; --muted:#aab4de; --gold:#ffcb45;
  --a0:#e5484d; --a1:#2d7cf0; --a2:#d99a00; --a3:#139c62;
  --ok:#159f60; --bad:#cf3f47;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--stage);color:var(--ink);
  font-family:'Bricolage Grotesque','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{min-height:100%;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{line-height:1.12;margin:0}
p{margin:0}

.btn{border:1px solid var(--line);border-radius:12px;padding:.75em 1.25em;font-weight:600;background:var(--panel-2)}
.btn:hover{background:#2b3872}
.btn.primary{background:var(--gold);color:#1d1604;border-color:transparent;font-weight:800}
.btn.primary:hover{background:#ffd872}
.btn.danger{color:#ffb3b7}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.big{font-size:1.2rem;padding:.9em 1.8em;border-radius:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.shp{width:1.1em;height:1.1em;flex:none}
.a0{--c:var(--a0)} .a1{--c:var(--a1)} .a2{--c:var(--a2)} .a3{--c:var(--a3)}

/* ---------- Home ---------- */
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px 20px;text-align:center}
.mark{display:grid;grid-template-columns:repeat(2,44px);gap:6px}
.mark span{height:44px;border-radius:10px;background:var(--c);display:grid;place-items:center;color:#fff}
.mark .shp{width:22px;height:22px}
.home h1{font-size:clamp(2.6rem,9vw,4.2rem);font-weight:800;letter-spacing:-.02em}
.join{width:min(380px,100%);display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
.join input{width:100%;text-align:center;font-size:1.6rem;font-weight:800;letter-spacing:.2em;padding:.6em;border-radius:12px;border:2px solid var(--line);background:var(--stage)}
.join input.name{letter-spacing:0;font-size:1.3rem}
.join input:focus{border-color:var(--gold);outline:none}
.err{color:#ffb3b7;font-size:.95rem}
.hint{color:var(--muted);font-size:.95rem}

/* ---------- Editor ---------- */
.wrap{width:100%;max-width:860px;margin:0 auto;padding:28px 20px 80px}
.ed-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ed-head h1{font-size:2rem;font-weight:800}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.field span{color:var(--muted);font-size:.95rem}
.field input,.qcard textarea,select{background:var(--stage);border:1px solid var(--line);border-radius:10px;padding:.65em .8em;width:100%}
.field input{font-size:1.25rem;font-weight:600}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.qcard-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.qnum{font-weight:800;color:var(--gold)}
.qtools{display:flex;gap:4px}
.qtools button{background:none;border:0;color:var(--muted);padding:6px 8px;border-radius:8px;font-size:.9rem}
.qtools button:hover{background:var(--panel-2);color:var(--ink)}
.qcard > textarea{resize:vertical;font-size:1.1rem;font-weight:600;min-height:3em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.opt{display:flex;align-items:center;gap:8px;background:var(--stage);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:6px 8px}
.opt .shp{color:var(--c)}
.opt textarea{border:0;padding:.45em .3em;background:transparent;resize:vertical;min-height:2.6em;font-size:.95rem}
.opt textarea:focus{outline:none}
.opt:focus-within{border-color:var(--gold)}
.opt.is-correct{background:#12301f;border-color:var(--ok)}
.correct{display:flex;align-items:center;gap:5px;font-size:.85rem;color:var(--muted);white-space:nowrap;cursor:pointer}
.correct input{accent-color:var(--ok);width:18px;height:18px}
.limit{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.95rem}
.limit select{width:auto}
.ed-actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 34px}
.launch{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.launch h2{font-size:1.3rem}
.errors{margin:0;padding-left:1.2em;color:#ffb3b7}

/* ---------- Host (projector) ---------- */
.host{flex:1;display:flex;flex-direction:column;gap:clamp(8px,2vh,28px);padding:clamp(14px,2.5vw,36px)}
.hbar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-weight:600;flex-wrap:wrap}
.hbar b{color:var(--ink)}
.lobby{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(16px,3vw,48px);align-items:center}
.lobby-join{display:flex;flex-direction:column;gap:10px}
.lobby-join .how{font-size:clamp(1.1rem,2vw,1.5rem);color:var(--muted)}
.lobby-join .url{font-size:clamp(1rem,1.6vw,1.25rem);font-weight:600;word-break:break-all}
.pin{font-size:clamp(4rem,12vw,9rem);font-weight:800;letter-spacing:.06em;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.qr{background:#fff;padding:14px;border-radius:16px;line-height:0}
.qr img,.qr canvas{width:clamp(180px,24vw,300px)!important;height:auto!important}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-height:48px}
.chip{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:.4em .9em;font-weight:600;font-size:1.05rem}
.chip:hover{border-color:var(--bad);text-decoration:line-through}
.count{font-size:1.3rem;font-weight:800}
.hfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.warn{background:#3b2a07;border:1px solid #8a6412;color:#ffe2a0;padding:10px 14px;border-radius:10px;font-size:.95rem}

.qtext{font-size:clamp(1.3rem,min(3.4vw,5vh),3rem);font-weight:800;text-align:center;max-width:30ch;margin:0 auto;letter-spacing:-.01em}
.stage-mid{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(24px,6vw,90px)}
.ring{position:relative;width:clamp(84px,min(18vw,20vh),220px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--panel-2)}
.ring .arc{stroke:var(--gold);transition:stroke-dashoffset .2s linear}
.ring.low .arc{stroke:var(--a0)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(2rem,min(7vw,8vh),5.5rem);font-weight:800;font-variant-numeric:tabular-nums}
.tally{text-align:center}
.tally b{display:block;font-size:clamp(2rem,min(7vw,8vh),5.5rem);line-height:1;font-variant-numeric:tabular-nums}
.tally span{color:var(--muted);font-size:1.2rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.2vw,16px)}
.tile{background:var(--c);color:#fff;border:0;border-radius:14px;display:flex;align-items:center;gap:.6em;padding:clamp(12px,1.8vh,22px) clamp(14px,1.6vw,24px);font-size:clamp(.95rem,min(1.8vw,2.9vh),1.7rem);line-height:1.22;font-weight:700;text-align:left;min-height:clamp(56px,10vh,120px)}
.tile .shp{width:1.3em;height:1.3em}
.tile .t{flex:1}
.tile .n{font-size:1.3em;font-weight:800;font-variant-numeric:tabular-nums}
.tile.dim{opacity:.28}
.tile.win{box-shadow:0 0 0 5px var(--stage),0 0 0 9px #fff}

.board{flex:1;display:flex;flex-direction:column;gap:10px;width:min(900px,100%);margin:0 auto}
.board h1{font-size:clamp(2rem,4vw,3rem);font-weight:800;text-align:center;margin-bottom:10px}
.brow{display:grid;grid-template-columns:3ch 1fr auto auto;gap:16px;align-items:center;background:var(--panel);border-radius:12px;padding:14px 20px;font-size:clamp(1.2rem,2.2vw,1.8rem);font-weight:700}
.brow .r{color:var(--muted);font-variant-numeric:tabular-nums}
.brow .s{font-variant-numeric:tabular-nums}
.brow .g{color:var(--gold);font-size:.75em;font-variant-numeric:tabular-nums;min-width:5ch;text-align:right}
.brow:first-of-type{background:var(--panel-2);outline:2px solid var(--gold)}

.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:clamp(8px,2vw,24px);width:min(900px,100%);margin:0 auto}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.pod .nm{font-size:clamp(1.2rem,2.6vw,2.2rem);font-weight:800;word-break:break-word}
.pod .sc{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.pod .blk{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:start center;padding-top:14px;font-size:clamp(2rem,5vw,4rem);font-weight:800;color:#1d1604}
.pod.p1 .blk{height:clamp(150px,30vh,280px);background:var(--gold)}
.pod.p2 .blk{height:clamp(110px,21vh,200px);background:#cfd6f2}
.pod.p3 .blk{height:clamp(80px,15vh,150px);background:#e7a36b}
.rest{width:min(900px,100%);margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;color:var(--muted)}

/* ---------- Player (phone) ---------- */
.pl{flex:1;display:flex;flex-direction:column;padding:14px;gap:14px}
.pbar{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--muted)}
.pbar .sec{font-size:1.5rem;color:var(--ink);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.pq{font-size:1.15rem;font-weight:700;text-align:center;padding:0 6px}
.ptiles{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px;min-height:280px}
.ptiles .tile{flex-direction:column;justify-content:center;text-align:center;font-size:1rem;line-height:1.3;min-height:0;border-radius:16px;padding:12px 10px;overflow:hidden}
.ptiles .tile .shp{width:1.8em;height:1.8em}
.ptiles .tile:active{transform:scale(.97)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
.center h1{font-size:clamp(2rem,9vw,3rem);font-weight:800}
.center .big{font-size:clamp(2.6rem,13vw,4rem);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.center .sub{color:var(--muted);font-size:1.1rem;max-width:30ch}
.full-ok{background:var(--ok)} .full-bad{background:var(--bad)}
.full-ok .sub,.full-bad .sub{color:#fff;opacity:.9}
.lock{width:120px;height:120px;border-radius:24px;background:var(--c);display:grid;place-items:center;color:#fff}
.lock .shp{width:60px;height:60px}
.me-name{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.4em 1.1em;font-weight:800;font-size:1.3rem}
.dots{display:flex;gap:8px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}

small.en{display:block;font-size:.74em;font-weight:500;opacity:.88;margin-top:.3em;letter-spacing:0}
.qtext small.en{font-size:.55em;opacity:.8}
small.zh{display:block;font-size:.6em;font-weight:600;opacity:.85;margin-top:.2em;letter-spacing:0}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.sets button{border:1px solid var(--line);background:var(--stage);border-radius:999px;padding:.5em 1.1em;font-weight:600}
.sets button[aria-pressed=true]{background:var(--gold);color:#1d1604;border-color:transparent}
#net{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:#8a6412;color:#fff;text-align:center;font-weight:600;display:none;z-index:10}
#net.show{display:block}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:#fff;color:var(--stage);padding:10px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:11}
#toast.show{opacity:1}

@media (max-width:760px){
  .lobby{grid-template-columns:1fr;justify-items:center;text-align:center}
}
@media (max-width:560px){ .opts{grid-template-columns:1fr} .tiles{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div id="net" role="status">Connection lost. Reconnecting… 连接中断，正在重连…</div>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* =====================================================================
   SETTINGS: paste your Firebase config here (see SETUP-GUIDE.md).
   Replace the word null with your config, from { to };
   Example:
   const FIREBASE_CONFIG = {
     apiKey: "AIza...",
     authDomain: "my-quiz.firebaseapp.com",
     databaseURL: "https://my-quiz-default-rtdb.asia-southeast1.firebasedatabase.app",
     projectId: "my-quiz",
     appId: "1:123:web:abc"
   };
   ===================================================================== */
const FIREBASE_CONFIG = {
  databaseURL: "https://pbs-quiz-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "pbs-quiz"
};

/* ---------------- helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LIMITS = [10, 20, 30, 60];
const SHAPE_PATHS = [
  '<path d="M12 3 22 20.5H2z"/>',
  '<path d="M12 1.5 22.5 12 12 22.5 1.5 12z"/>',
  '<circle cx="12" cy="12" r="10"/>',
  '<rect x="3" y="3" width="18" height="18" rx="1.5"/>'
];
const shape = i => `<svg class="shp" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${SHAPE_PATHS[i]}</svg>`;
const ANSWER_NAMES = ['Triangle', 'Diamond', 'Circle', 'Square'];
const fmt = n => Number(n || 0).toLocaleString('en');
const ordinal = n => { const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const uid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36)).replace(/-/g, '');
const clone = o => JSON.parse(JSON.stringify(o));
// Question/answer text: line 1 = Chinese, line 2 = English (shown smaller)
const biText = t => { const i = String(t || '').indexOf('\n'); return i < 0 ? esc(t) : `${esc(t.slice(0, i))}<small class="en">${esc(t.slice(i + 1).trim())}</small>`; };
const bi = (en, zh) => `${en}<small class="zh">${zh}</small>`;

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3200); }
function netStatus(state){ $('#net').classList.toggle('show', state === 'reconnecting'); }
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const sess = {
  get(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { sessionStorage.setItem(k, v); } catch(e){} }
};
function withTimeout(p, ms, msg){
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))]);
}
function friendly(e){
  const m = String((e && (e.message || e.code)) || e || '');
  if (/permission/i.test(m)) return 'Firebase blocked the game. Check the database rules in the setup guide.';
  if (/database url|databaseURL/i.test(m)) return 'The Firebase settings are missing the databaseURL line. See the setup guide.';
  return m || 'Something went wrong. Try again.';
}
function ranking(players){
  return Object.entries(players || {}).map(([id, p]) => ({ id, n: p.n || p.name || 'Player', s: p.s ?? p.score ?? 0, g: p.g ?? p.gained ?? 0, ok: p.ok ?? null }))
    .sort((a, b) => b.s - a.s || a.n.localeCompare(b.n));
}
const rankOf = (list, id) => { const me = list.find(x => x.id === id); return me ? 1 + list.filter(x => x.s > me.s).length : null; };

const SET_LABELS = { pre: 'Pre-test 前测', post: 'Post-test 后测' };
function normQuiz(q){
  if (!q || !Array.isArray(q.questions)) return null;
  return {
    title: String(q.title || 'Live quiz').slice(0, 80),
    questions: q.questions.map(x => ({
      text: String(x.text || '').slice(0, 600),
      options: [0,1,2,3].map(i => String((x.options || [])[i] || '').slice(0, 220)),
      correct: [0,1,2,3].includes(+x.correct) ? +x.correct : 0,
      limit: LIMITS.includes(+x.limit) ? +x.limit : 30
    }))
  };
}
const QUESTIONS_VERSION = 2; // bump when the built-in questions change
const savedSets = store.get('lq-sets-v') === QUESTIONS_VERSION ? (store.get('lq-sets', {}) || {}) : {};
const sets = {};
for (const k of Object.keys(DEFAULT_SETS)) sets[k] = normQuiz(savedSets[k]) || normQuiz(DEFAULT_SETS[k]);
let activeSet = sets[store.get('lq-active')] ? store.get('lq-active') : 'pre';
let quiz = sets[activeSet];
const saveQuiz = () => { sets[activeSet] = quiz; store.set('lq-sets', sets); store.set('lq-sets-v', QUESTIONS_VERSION); store.set('lq-active', activeSet); };

function makePin(){
  let s = String(1 + Math.floor(Math.random() * 9));
  for (let i = 0; i < 5; i++) s += Math.floor(Math.random() * 10);
  return s;
}

/* ================= TRANSPORTS ================= */
let fbDb = null;
function getFb(){
  if (!FIREBASE_CONFIG) throw new Error("Firebase isn't set up in this file yet. Add your Firebase settings (see the setup guide).");
  if (!FIREBASE_CONFIG.databaseURL) throw new Error('The Firebase settings are missing the databaseURL line. See the setup guide.');
  if (typeof firebase === 'undefined') throw new Error("Couldn't load Firebase. Check the internet connection.");
  if (!fbDb){ if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG); fbDb = firebase.database(); }
  return fbDb;
}

async function hostFirebase(pin, h){
  const base = getFb().ref('games/' + pin);
  const ex = await withTimeout(base.child('meta').once('value'), 12000, "Couldn't reach Firebase. Check the internet connection and the databaseURL.");
  if (ex.exists() && Date.now() - (ex.val().created || 0) < 12 * 3600e3) throw { type: 'unavailable-id' };
  await base.remove();
  await base.child('meta').set({ created: Date.now() });
  const pRef = base.child('players'), aRef = base.child('answers');
  pRef.on('child_added', s => { const v = s.val() || {}; h.onJoin(s.key, v.name); });
  aRef.on('child_added', s => { const v = s.val() || {}; h.onAnswer(v.pid, v.q, v.c); });
  return {
    broadcast(st){ base.child('state').set(st).catch(e => toast(friendly(e))); },
    close(remove){ pRef.off(); aRef.off(); if (remove) base.remove().catch(() => {}); }
  };
}

async function joinFirebase(pin, pid, name, onState){
  const base = getFb().ref('games/' + pin);
  const meta = await withTimeout(base.child('meta').once('value'), 12000, "Couldn't reach the game. Check your internet connection. 无法连接，请检查网络。");
  if (!meta.exists()) throw new Error('No game found with that PIN. Check the number on the screen. 找不到这个游戏，请核对屏幕上的密码。');
  await base.child('players/' + pid).set({ name });
  const sRef = base.child('state');
  sRef.on('value', s => onState(s.val()));
  const info = getFb().ref('.info/connected');
  let seen = false;
  info.on('value', s => { if (s.val()) { seen = true; netStatus('ok'); } else if (seen) netStatus('reconnecting'); });
  return { answer(q, c){ base.child('answers').push({ pid, q, c }); }, close(){ sRef.off(); info.off(); } };
}

function validateQuiz(){
  const errs = [];
  if (!quiz.questions.length) errs.push('Add at least one question.');
  quiz.questions.forEach((q, i) => {
    if (!q.text.trim()) errs.push(`Question ${i + 1} needs question text.`);
    if (q.options.filter(o => o.trim()).length < 2) errs.push(`Question ${i + 1} needs at least 2 answers.`);
    else if (!q.options[q.correct].trim()) errs.push(`Question ${i + 1}: the answer marked correct is empty.`);
  });
  return errs;
}

async function startHost(btn){
  const errs = validateQuiz();
  const box = $('#errors');
  box.innerHTML = errs.map(e => `<li>${esc(e)}</li>`).join('');
  if (errs.length) return box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  btn.disabled = true; btn.textContent = 'Connecting…';
  const q = clone(quiz);
  q.questions.forEach(x => x.options = x.options.map(o => o.trim()));
  G = { pin: '', tx: null, quiz: q, phase: 'lobby', qi: -1, players: {}, order: [], removed: [], answers: {}, qStart: 0, tick: null, hb: null, counts: [0,0,0,0] };
  const handlers = { onJoin: hostOnJoin, onAnswer: hostOnAnswer };
  try {
    for (let tries = 0; ; tries++){
      G.pin = makePin();
      try { G.tx = await hostFirebase(G.pin, handlers); break; }
      catch(e){ if (e && e.type === 'unavailable-id' && tries < 4) continue; throw e; }
    }
  } catch(e){
    G = null; btn.disabled = false; btn.textContent = 'Open lobby: ' + (SET_LABELS[activeSet] || quiz.title);
    box.innerHTML = `<li>${esc(friendly(e))}</li>`; return;
  }
  window.onbeforeunload = () => (G ? 'Leaving will end the game for everyone.' : undefined);
  app.oninput = app.onchange = null;
  renderLobby(); bc(true);
}

function cleanName(n){ return String(n || '').replace(/\s+/g, ' ').trim().slice(0, 16) || 'Player'; }

function hostOnJoin(pid, name){
  if (!G || typeof pid !== 'string' || G.removed.includes(pid)) { bc(); return; }
  if (!G.players[pid]){
    let nm = cleanName(name), base = nm, k = 2;
    const taken = new Set(Object.values(G.players).map(p => p.name.toLowerCase()));
    while (taken.has(nm.toLowerCase())) nm = `${base.slice(0, 13)} ${k++}`;
    G.players[pid] = { name: nm, score: 0, gained: 0, ok: null };
    G.order.push(pid);
    if (G.phase === 'lobby') renderLobby(); else updateAnswered();
  }
  bc();
}

function hostOnAnswer(pid, q, c){
  if (!G || G.phase !== 'question' || q !== G.qi || !G.players[pid] || G.answers[pid]) return;
  const Q = G.quiz.questions[G.qi];
  c = +c;
  if (![0,1,2,3].includes(c) || !Q.options[c]) return;
  const t = Date.now() - G.qStart;
  if (t > Q.limit * 1000 + 1000) return;
  G.answers[pid] = { c, t };
  updateAnswered();
  if (Object.keys(G.answers).length >= Object.keys(G.players).length) reveal();
  else bc();
}

let bcT = null;
function bc(now){
  if (now){ clearTimeout(bcT); bcT = null; sendState(); return; }
  if (!bcT) bcT = setTimeout(() => { bcT = null; sendState(); }, 300);
}
function sendState(){ if (G && G.tx) G.tx.broadcast(buildState()); }

function buildState(){
  const Q = G.quiz.questions[G.qi];
  const players = {};
  for (const [id, p] of Object.entries(G.players)){
    players[id] = { n: p.name, s: p.score, g: p.gained, ok: p.ok, a: G.answers[id] ? 1 : 0 };
  }
  const st = { phase: G.phase, title: G.quiz.title, i: G.qi, total: G.quiz.questions.length, players, removed: G.removed.slice() };
  if (Q && (G.phase === 'question' || G.phase === 'reveal')){
    st.q = { text: Q.text, options: Q.options, limit: Q.limit };
  }
  if (G.phase === 'question'){
    st.remaining = Math.max(0, Q.limit * 1000 - (Date.now() - G.qStart));
    st.answered = Object.keys(G.answers).length;
  }
  if (G.phase === 'reveal'){ st.correct = Q.correct; st.counts = G.counts; }
  return st;
}

function hostHeader(){
  const n = Object.keys(G.players).length;
  const cur = Math.min(G.qi + 1, G.quiz.questions.length), tot = G.quiz.questions.length;
  const qLabel = G.qi >= 0 ? `Question <b>${cur}</b> of ${tot} &nbsp; 第 <b>${cur}</b> / ${tot} 题` : `<b>${esc(G.quiz.title)}</b>`;
  return `<div class="hbar"><span>${qLabel}</span><span>PIN 密码 <b>${G.pin}</b> &nbsp; ${n} player${n === 1 ? '' : 's'} 人</span></div>`;
}

function joinUrl(){ return location.origin + location.pathname + '?pin=' + G.pin; }

function renderLobby(){
  const isFile = location.protocol === 'file:';
  const url = joinUrl();
  const names = G.order.filter(id => G.players[id]).map(id => `<button class="chip" type="button" data-pid="${esc(id)}" title="Remove ${esc(G.players[id].name)}">${esc(G.players[id].name)}</button>`).join('');
  const n = Object.keys(G.players).length;
  app.innerHTML = `
  <section class="host">
    ${hostHeader()}
    <div class="lobby">
      <div class="lobby-join">
        <p class="how">扫码加入，或前往 Scan the code, or go to</p>
        <p class="url">${esc(isFile ? 'this page once it is online' : url.replace(/^https?:\/\//, '').replace(/\?pin=.*/, ''))}</p>
        <p class="how">输入密码 and enter the PIN</p>
        <div class="pin">${G.pin}</div>
      </div>
      <div class="qr" id="qr" aria-label="QR code to join"></div>
    </div>
    ${isFile ? `<p class="warn">You opened this file from your computer, so phones can't scan in. Host it online first (see the setup guide). You can still test by opening this file in a second browser tab and entering the PIN.</p>` : ''}
    <div><p class="count">${n ? `${n} player${n === 1 ? '' : 's'} joined 已加入` : 'Waiting for players… 等待加入…'}</p>${n ? '<p class="hint">Tap a name to remove that player.</p>' : ''}</div>
    <div class="chips">${names}</div>
    <div class="hfoot">
      <button class="btn ghost danger" type="button" data-act="cancel">Cancel game</button>
      <button class="btn primary big" type="button" data-act="begin" data-primary ${n ? '' : 'disabled'}>Start quiz 开始</button>
    </div>
  </section>`;
  if (!isFile && typeof QRCode !== 'undefined'){
    new QRCode($('#qr'), { text: url, width: 300, height: 300, correctLevel: QRCode.CorrectLevel.M });
  } else $('#qr').style.display = 'none';
  app.onclick = e => {
    const chip = e.target.closest('.chip');
    if (chip){
      const pid = chip.dataset.pid, p = G.players[pid];
      if (p && confirm(`Remove ${p.name} from the game?`)){ G.removed.push(pid); delete G.players[pid]; renderLobby(); bc(true); }
      return;
    }
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'begin') startQuestion(0);
    if (b.dataset.act === 'cancel' && confirm('Cancel this game? Players will be disconnected.')) endGame();
  };
}

const RING_C = 2 * Math.PI * 54;
function startQuestion(i){
  G.qi = i; G.phase = 'question'; G.answers = {};
  for (const p of Object.values(G.players)){ p.gained = 0; p.ok = null; }
  const Q = G.quiz.questions[i];
  app.innerHTML = `
  <section class="host">
    ${hostHeader()}
    <h1 class="qtext">${biText(Q.text)}</h1>
    <div class="stage-mid">
      <div class="ring" id="ring"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="54" fill="none" stroke-width="10"/><circle class="arc" id="arc" cx="60" cy="60" r="54" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="${RING_C}" stroke-dashoffset="0"/></svg><span id="secs">${Q.limit}</span></div>
      <div class="tally"><b id="ans">0</b><span>answers 已作答</span></div>
    </div>
    <div class="tiles">${Q.options.map((o, k) => o ? `<div class="tile a${k}">${shape(k)}<span class="t">${biText(o)}</span></div>` : '').join('')}</div>
    <div class="hfoot"><span></span><button class="btn" type="button" data-act="skip">End question now 结束本题</button></div>
  </section>`;
  app.onclick = e => { const b = e.target.closest('[data-act]'); if (b && b.dataset.act === 'skip') reveal(); };
  G.qStart = Date.now();
  clearInterval(G.tick); clearInterval(G.hb);
  G.tick = setInterval(tickTimer, 200);
  G.hb = setInterval(() => bc(true), 2000);
  bc(true);
}
function tickTimer(){
  if (!G || G.phase !== 'question') return;
  const Q = G.quiz.questions[G.qi];
  const rem = Math.max(0, Q.limit * 1000 - (Date.now() - G.qStart));
  const secs = $('#secs'), arc = $('#arc'), ring = $('#ring');
  if (secs) secs.textContent = Math.ceil(rem / 1000);
  if (arc) arc.setAttribute('stroke-dashoffset', String(RING_C * (1 - rem / (Q.limit * 1000))));
  if (ring) ring.classList.toggle('low', rem <= 5000);
  if (rem <= 0) reveal();
}
function updateAnswered(){ const el = $('#ans'); if (el) el.textContent = Object.keys(G.answers).length; }

function reveal(){
  if (!G || G.phase !== 'question') return;
  clearInterval(G.tick); clearInterval(G.hb);
  G.phase = 'reveal';
  const Q = G.quiz.questions[G.qi], lim = Q.limit * 1000;
  G.counts = [0,0,0,0];
  for (const [pid, p] of Object.entries(G.players)){
    const a = G.answers[pid];
    if (a) G.counts[a.c]++;
    if (a && a.c === Q.correct){
      const pts = Math.max(500, Math.min(1000, Math.round(1000 * (1 - (Math.min(a.t, lim) / lim) / 2))));
      p.score += pts; p.gained = pts; p.ok = true;
    } else { p.gained = 0; p.ok = a ? false : null; }
  }
  const total = G.counts.reduce((x, y) => x + y, 0);
  const right = G.counts[Q.correct];
  app.innerHTML = `
  <section class="host">
    ${hostHeader()}
    <h1 class="qtext">${biText(Q.text)}</h1>
    <div class="stage-mid"><div class="tally"><b>${right}/${Object.keys(G.players).length}</b><span>got it right 答对${total < Object.keys(G.players).length ? ` (${Object.keys(G.players).length - total} didn't answer 未作答)` : ''}</span></div></div>
    <div class="tiles">${Q.options.map((o, k) => o ? `<div class="tile a${k} ${k === Q.correct ? 'win' : 'dim'}">${shape(k)}<span class="t">${biText(o)}</span>${k === Q.correct ? '<span class="n">✓</span>' : ''}<span class="n">${G.counts[k]}</span></div>` : '').join('')}</div>
    <div class="hfoot"><span></span><button class="btn primary big" type="button" data-act="next" data-primary>Show leaderboard 排行榜</button></div>
  </section>`;
  app.onclick = e => { const b = e.target.closest('[data-act]'); if (b) showBoard(); };
  bc(true);
}

function showBoard(){
  G.phase = G.qi + 1 >= G.quiz.questions.length ? 'final' : 'leaderboard';
  if (G.phase === 'final') return showFinal();
  const list = ranking(G.players).slice(0, 5);
  app.innerHTML = `
  <section class="host">
    ${hostHeader()}
    <div class="board">
      <h1>${bi('Leaderboard', '排行榜')}</h1>
      ${list.map((p, k) => `<div class="brow"><span class="r">${k + 1}</span><span>${esc(p.n)}</span><span class="g">${p.g ? '+' + fmt(p.g) : ''}</span><span class="s">${fmt(p.s)}</span></div>`).join('') || '<p class="hint">No players yet. 暂无玩家。</p>'}
    </div>
    <div class="hfoot"><span></span><button class="btn primary big" type="button" data-act="next" data-primary>Next question 下一题</button></div>
  </section>`;
  app.onclick = e => { const b = e.target.closest('[data-act]'); if (b) startQuestion(G.qi + 1); };
  bc(true);
}

function showFinal(){
  G.phase = 'final';
  const list = ranking(G.players);
  const top = [list[1], list[0], list[2]];
  const cls = ['p2', 'p1', 'p3'], num = [2, 1, 3];
  app.innerHTML = `
  <section class="host">
    ${hostHeader()}
    <div class="board" style="flex:0"><h1>${bi('Final results', '最终成绩')}</h1></div>
    <div class="podium">${top.map((p, k) => p ? `<div class="pod ${cls[k]}"><span class="nm">${esc(p.n)}</span><span class="sc">${fmt(p.s)} pts 分</span><div class="blk">${num[k]}</div></div>` : '<div></div>').join('')}</div>
    <div class="rest">${list.slice(3, 15).map((p, k) => `<span>${k + 4}. ${esc(p.n)} (${fmt(p.s)})</span>`).join(' ')}</div>
    <div class="hfoot"><span></span><button class="btn" type="button" data-act="end">End game and edit quiz</button></div>
  </section>`;
  app.onclick = e => { const b = e.target.closest('[data-act]'); if (b && confirm('End the game? Players will see a thank-you screen.')) endGame(); };
  bc(true);
}

function endGame(){
  if (!G) return;
  clearInterval(G.tick); clearInterval(G.hb);
  G.phase = 'ended'; bc(true);
  const tx = G.tx; G = null; window.onbeforeunload = null;
  setTimeout(() => tx && tx.close(true), 1500);
  renderEditor();
}

document.addEventListener('keydown', e => {
  if (!G || e.target.closest('input,textarea,select')) return;
  if (e.key === 'Enter' || e.key === ' '){ const b = $('[data-primary]'); if (b && !b.disabled){ e.preventDefault(); b.click(); } }
});

/* ================= PLAYER ================= */
let P = null;

function renderNickname(pin, errMsg){
  app.onclick = app.oninput = app.onchange = null;
  const saved = sess.get('lq-name-' + pin) || '';
  app.innerHTML = `
  <section class="home">
    <div class="mark" aria-hidden="true">${[0,1,2,3].map(i => `<span class="a${i}">${shape(i)}</span>`).join('')}</div>
    <form class="join" id="nickForm" novalidate>
      <p class="hint">Game PIN 密码 ${esc(pin)}</p>
      <input class="name" id="nick" maxlength="16" autocomplete="nickname" placeholder="Nickname 昵称" aria-label="Your nickname" value="${esc(saved)}">
      <button class="btn primary big" type="submit" id="goBtn">Join 加入</button>
      ${errMsg ? `<p class="err">${esc(errMsg)}</p>` : ''}
    </form>
  </section>`;
  $('#nick').focus();
  $('#nickForm').onsubmit = e => {
    e.preventDefault();
    const name = cleanName($('#nick').value);
    if (!$('#nick').value.trim()) return renderNickname(pin, 'Enter a nickname. 请输入昵称。');
    joinGame(pin, name);
  };
}

async function joinGame(pin, name){
  const btn = $('#goBtn'); if (btn){ btn.disabled = true; btn.textContent = 'Joining… 加入中…'; }
  let pid = sess.get('lq-pid-' + pin);
  if (!pid){ pid = uid(); sess.set('lq-pid-' + pin, pid); }
  sess.set('lq-name-' + pin, name);
  P = { pin, pid, name, tx: null, s: null, key: '', my: {}, deadline: 0, tick: null, ever: false, final: null };
  try {
    P.tx = await joinFirebase(pin, pid, name, onPlayerState);
    history.replaceState(null, '', location.pathname + '?pin=' + pin);
    if (!P.ever) renderPlayerMsg(bi("You're in!", '加入成功！'), 'Watch the main screen. The quiz starts soon.<br>请看大屏幕，问答即将开始。', true);
  } catch(e){
    P = null; renderNickname(pin, friendly(e));
  }
}

function onPlayerState(s){
  if (!P) return;
  if (s === null || s === undefined){ if (P.ever) playerEnded(); return; }
  P.ever = true; P.s = s;
  if ((s.removed || []).includes(P.pid)){ P.tx.close(); P = null; renderPlayerMsg(bi('You were removed from this game', '你已被移出游戏'), 'Ask the host if this was a mistake.<br>如有误会，请联系主持人。'); return; }
  if (s.phase === 'ended') return playerEnded();
  if (s.phase === 'final') P.final = s;
  const me = (s.players || {})[P.pid];
  if (s.phase === 'question'){
    P.deadline = Date.now() + (s.remaining || 0);
    if (me && me.a && P.my[s.i] === undefined) P.my[s.i] = 'sent';
  }
  const key = [s.phase, s.i, me ? 1 : 0].join(':');
  if (key !== P.key){ P.key = key; renderPlayer(); }
}

function playerEnded(){
  const fin = P && P.final;
  if (P){ clearInterval(P.tick); P.tx && P.tx.close(); }
  let sub = 'Thanks for playing!<br>谢谢参与！';
  if (fin && P){
    const list = ranking(fin.players), r = rankOf(list, P.pid);
    if (r){ const pts = fmt(list.find(x => x.id === P.pid).s); sub = `You finished ${ordinal(r)} with ${pts} points.<br>你获得第 ${r} 名，共 ${pts} 分。<br>Thanks for playing! 谢谢参与！`; }
  }
  P = null;
  renderPlayerMsg(bi('The game has ended', '游戏已结束'), sub);
}

// title and sub are HTML: escape any user-supplied text before passing it in
function renderPlayerMsg(title, sub, waiting){
  app.onclick = null;
  app.innerHTML = `<section class="pl"><div class="center">
    ${P ? `<span class="me-name">${esc(P.name)}</span>` : ''}
    <h1>${title}</h1><p class="sub">${sub}</p>
    ${waiting ? '<div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>' : ''}
  </div></section>`;
}

function renderPlayer(){
  const s = P.s, me = (s.players || {})[P.pid];
  clearInterval(P.tick);
  if (!me) return renderPlayerMsg(bi('Joining…', '加入中…'), 'Hang on while the host adds you.<br>请稍候。', true);
  const list = ranking(s.players), r = rankOf(list, P.pid);
  switch (s.phase){
    case 'lobby': return renderPlayerMsg(bi("You're in!", '加入成功！'), 'Watch the main screen. The quiz starts soon.<br>请看大屏幕，问答即将开始。', true);
    case 'question': return renderPlayerQuestion();
    case 'reveal': {
      const cls = me.ok ? 'full-ok' : 'full-bad';
      const head = me.ok ? bi('Correct!', '答对了！') : (me.ok === false ? bi('Not quite', '答错了') : bi("Time's up", '时间到'));
      const right = s.q && s.q.options[s.correct];
      app.onclick = null;
      app.innerHTML = `<section class="pl ${cls}"><div class="center">
        <h1>${head}</h1>
        ${me.ok ? `<p class="big">+${fmt(me.g)}</p>` : `<p class="sub">Answer 正确答案：<br><b>${biText(right || '')}</b></p>`}
        <p class="sub">${fmt(me.s)} points so far${r ? `, ${ordinal(r)} place` : ''}<br>目前 ${fmt(me.s)} 分${r ? `，第 ${r} 名` : ''}</p>
      </div></section>`;
      return;
    }
    case 'leaderboard': {
      const idx = list.findIndex(x => x.id === P.pid);
      const ahead = idx > 0 ? list[idx - 1] : null;
      const gap = ahead && ahead.s > me.s
        ? `${fmt(me.s)} points, ${fmt(ahead.s - me.s)} behind ${esc(ahead.n)}.<br>${fmt(me.s)} 分，落后 ${esc(ahead.n)} ${fmt(ahead.s - me.s)} 分。`
        : `${fmt(me.s)} points 分${r === 1 ? '<br>You lead the pack! 你目前领先！' : ''}`;
      return renderPlayerMsg(bi(`You're ${ordinal(r)}`, `你排第 ${r} 名`), gap);
    }
    case 'final': return renderPlayerMsg(r === 1 ? bi('You won!', '你赢了！') : bi(`You finished ${ordinal(r)}`, `你获得第 ${r} 名`), `${fmt(me.s)} points 分<br>Thanks for playing! 谢谢参与！`);
    default: return renderPlayerMsg(bi("You're in!", '加入成功！'), 'Watch the main screen. The quiz starts soon.<br>请看大屏幕，问答即将开始。', true);
  }
}

function renderPlayerQuestion(){
  const s = P.s, q = s.q || { options: [] }, mine = P.my[s.i];
  const bar = `<div class="pbar"><span>Q${s.i + 1}/${s.total} 第 ${s.i + 1} 题</span><span class="sec" id="psec"></span></div>`;
  if (mine !== undefined){
    const known = typeof mine === 'number';
    app.onclick = null;
    app.innerHTML = `<section class="pl">${bar}<div class="center">
      ${known ? `<div class="lock a${mine}">${shape(mine)}</div>` : ''}
      <h1>${mine === 'late' ? bi("Time's up", '时间到') : bi('Answer locked in', '已提交答案')}</h1>
      <p class="sub">${mine === 'late' ? 'Get ready for the next one.<br>准备下一题。' : 'Waiting for everyone else…<br>等待其他人作答…'}</p>
    </div></section>`;
  } else {
    app.innerHTML = `<section class="pl">${bar}
      <p class="pq">${biText(q.text)}</p>
      <div class="ptiles">${q.options.map((o, k) => o ? `<button class="tile a${k}" type="button" data-c="${k}" aria-label="${ANSWER_NAMES[k]}: ${esc(String(o).replace(/\n/g, ' '))}">${shape(k)}<span>${biText(o)}</span></button>` : '').join('')}</div>
    </section>`;
    app.onclick = e => {
      const b = e.target.closest('[data-c]'); if (!b || !P || P.my[s.i] !== undefined) return;
      const c = +b.dataset.c;
      P.my[s.i] = c; P.tx.answer(s.i, c);
      if (navigator.vibrate) try { navigator.vibrate(30); } catch(_){}
      renderPlayerQuestion();
    };
  }
  const upd = () => {
    if (!P || !P.s || P.s.phase !== 'question') return clearInterval(P && P.tick);
    const rem = Math.max(0, P.deadline - Date.now());
    const el = $('#psec'); if (el) el.textContent = Math.ceil(rem / 1000);
    if (rem <= 0 && P.my[P.s.i] === undefined){ P.my[P.s.i] = 'late'; renderPlayerQuestion(); }
  };
  clearInterval(P.tick); P.tick = setInterval(upd, 250); upd();
}

/* ================= BOOT ================= */
(function boot(){
  const pin = (new URLSearchParams(location.search).get('pin') || '').replace(/\D/g, '');
  if (/^\d{6}$/.test(pin)){
    const name = sess.get('lq-name-' + pin);
    if (name && sess.get('lq-pid-' + pin)){ renderNickname(pin); joinGame(pin, name); }
    else renderNickname(pin);
  } else renderHome();
})();
</script>
